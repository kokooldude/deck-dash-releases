# Install this file as .github/workflows/release-appimage.yml in the public
# kokooldude/deck-dash-releases repository. Never put source or keys there.
name: Release Steam Deck AppImage

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source tag or commit
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out private source with read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: kokooldude/deck-dash
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.DECK_DASH_SOURCE_READ_KEY }}
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Verify source
        working-directory: source
        run: |
          npm ci
          npm run check

      - name: Ensure version has not already been released
        id: version
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "deck-dash-v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $version is already published; bump the source version." >&2
            exit 1
          fi

      - name: Build Chromium AppImage
        working-directory: source
        run: npm run electron:build

      - name: Sign hardware-test AppImage
        working-directory: source
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          appimage="release-electron/Deck.Dash_${VERSION}_x86_64.AppImage"
          npx tauri signer sign "$appimage" --app-version "$VERSION"

      - name: Publish release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "deck-dash-v$VERSION" \
            "release-electron/Deck.Dash_${VERSION}_x86_64.AppImage" \
            "release-electron/Deck.Dash_${VERSION}_x86_64.AppImage.sig" \
            "packaging/install-on-deck.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Deck Dash v$VERSION · Steam Deck hardware test" \
            --prerelease \
            --notes "Hardware-test build of the Milestone 1 shell with bundled Chromium software rendering. Tauri/Rust source remains in the private repository, but this preview package does not yet expose its native commands. Install over /home/deck/Applications/DeckDash.AppImage with install-on-deck.sh; an existing Steam shortcut at that path remains valid. Automatic updates are paused in this build while the update signature path is validated. Test in Desktop Mode first, then Gaming Mode."
